{#-
  Shared UI macros. Import in a page:
      {% import "_macros.html" as ui %}
      {% from "_icons.html" import icon %}
  `attrs` params are raw extra HTML attributes, e.g. attrs='id="autopay" aria-describedby="autopay-desc"'.
  JSON in attributes: data-payload="{{ obj|tojson_attr }}" (autoescaped). JSON in a
  <script type="application/json">: use Jinja's built-in {{ obj|tojson }} (tojson_attr gets
  HTML-escaped there). Dict keys named items/values/keys clash with dict methods in
  Jinja: write state.notifications['items'], not state.notifications.items.

  switch(testid, on, label=None, attrs='', act=None, payload=None, key='enabled')
      <button role="switch" aria-checked> with track, knob and visible On/Off text.
      label -> aria-label. With act, a click calls Acme.act(act, payload + {key: not on})
      and the page reloads showing the new position and the toast.
      e.g. ui.switch('autopay-toggle', state.billing.autopay, 'Autopay', act='billing.autopay')
  segmented(testid_prefix, options, value, label=None, act=None, payload=None, key='value', attrs='')
      Button group. options = [(value, text)]; button testid = testid_prefix ~ value;
      aria-pressed marks the current value. With act, a click calls
      Acme.act(act, payload + {key: value}). Without act it is client-side only (like chips).
      e.g. ui.segmented('a11y-text-size-', [('S','Small'),('M','Medium'),('L','Large')], a11y.text_size,
                        'Text size', act='settings.accessibility', payload={'key': 'text_size'})
  chips(testid_prefix, options, value=None, label=None, attrs='')
      Radio-like option buttons (role=radiogroup > role=radio[aria-checked]). Client-side:
      a click selects it, sets the group's data-value and fires a bubbling 'change' event.
      Select from JS with Acme.select(button).
  picker(testid, options, value=None, placeholder='Choose one', label_id=None, attrs='')
      In-page select. Button data-testid=testid, menu testid ~ '-menu', option testid ~ '-' ~ key.
      Picking sets [data-picker] root's data-value, updates the button text, fires 'change'.
  tabs(items, active, label='Sections')
      Link tabs. items = [(id, href, text)] or [(id, href, text, count)]; testid 'tab-' ~ id.
  page_header(title, subtitle=None)
      h1 + subtitle. Call-able for right-side actions: {% call ui.page_header('Billing') %}...{% endcall %}
  modal(testid, title, open=False, size='', title_testid=None, attrs='')
      Call-able. Hidden .modal-backdrop > .modal#testid[data-testid=testid] with a header
      (title + Close button). Put .modal-body / .modal-footer in the call body. Open with
      Acme.openModal(el) or a [data-modal-open="<testid>"] button; open=True opens on load.
      [data-modal-close] inside closes it. size: '' | 'sm' | 'lg'.
  setting_row(title, desc=None, title_id=None)
      Call-able. Row with title/description on the left and the call body (a switch) on the right.
  field(id, label, value='', testid=None, type='text', hint=None, error=None, error_testid=None,
        textarea=False, rows=4, prefix=None, placeholder=None, attrs='')
      Label + input/textarea (+ '$'-style prefix) + .hint + .error. The error line renders
      when error or error_testid is set (hidden while empty); fill it with Acme.setError(el, text).
  badge(text, kind='', icon_name=None)     kind: success | warning | danger | info | brand | count
  empty(icon_name, title, text=None)       Empty-state block for lists.
-#}
{%- from "_icons.html" import icon -%}

{%- macro _attrs(attrs) -%}{% if attrs %} {{ attrs|safe }}{% endif %}{%- endmacro -%}

{%- macro switch(testid, on, label=None, attrs='', act=None, payload=None, key='enabled') -%}
<button type="button" class="switch" role="switch" aria-checked="{{ 'true' if on else 'false' }}" data-testid="{{ testid }}"
  {%- if label %} aria-label="{{ label }}"{% endif %}
  {%- if act %} data-act="{{ act }}" data-act-key="{{ key }}" data-payload="{{ (payload or {})|tojson_attr }}"{% endif %}{{ _attrs(attrs) }}>
  <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span>
  <span class="switch-text">{{ 'On' if on else 'Off' }}</span>
</button>
{%- endmacro -%}

{%- macro segmented(testid_prefix, options, value, label=None, act=None, payload=None, key='value', attrs='') -%}
<div class="segmented" role="group"{% if label %} aria-label="{{ label }}"{% endif %} data-value="{{ value }}"{{ _attrs(attrs) }}>
  {%- for v, text in options %}
  {%- set p = dict(payload or {}) %}{% set _ = p.update({key: v}) %}
  <button type="button" class="segment" data-testid="{{ testid_prefix }}{{ v }}" data-value="{{ v }}" aria-pressed="{{ 'true' if v == value else 'false' }}"
    {%- if act %} data-act="{{ act }}" data-payload="{{ p|tojson_attr }}"{% endif %}>{{ text }}</button>
  {%- endfor %}
</div>
{%- endmacro -%}

{%- macro chips(testid_prefix, options, value=None, label=None, attrs='') -%}
<div class="chips" role="radiogroup" data-chips data-value="{{ value or '' }}"{% if label %} aria-label="{{ label }}"{% endif %}{{ _attrs(attrs) }}>
  {%- for v, text in options %}
  <button type="button" class="chip" role="radio" data-value="{{ v }}" data-testid="{{ testid_prefix }}{{ v }}" aria-checked="{{ 'true' if v == value else 'false' }}">{{ text }}</button>
  {%- endfor %}
</div>
{%- endmacro -%}

{%- macro picker(testid, options, value=None, placeholder='Choose one', label_id=None, attrs='') -%}
{%- set ns = namespace(text=placeholder) %}
{%- for v, t in options %}{% if v == value %}{% set ns.text = t %}{% endif %}{% endfor %}
<div class="picker dropdown" data-picker data-value="{{ value or '' }}"{{ _attrs(attrs) }}>
  <button type="button" class="picker-button{% if ns.text == placeholder %} is-placeholder{% endif %}" data-dropdown="{{ testid }}-menu" data-testid="{{ testid }}" aria-haspopup="listbox" aria-expanded="false"
    {%- if label_id %} aria-labelledby="{{ label_id }} {{ testid }}-value"{% endif %}>
    <span class="picker-value" id="{{ testid }}-value">{{ ns.text }}</span>{{ icon('chevron-down', '1.125rem') }}
  </button>
  <div class="dropdown-menu picker-menu" id="{{ testid }}-menu" data-testid="{{ testid }}-menu" role="listbox" hidden>
    {%- for v, t in options %}
    <button type="button" class="menu-item" role="option" data-value="{{ v }}" data-testid="{{ testid }}-{{ v }}" aria-selected="{{ 'true' if v == value else 'false' }}"><span class="grow">{{ t }}</span>{{ icon('check', '1.125rem', 'menu-check') }}</button>
    {%- endfor %}
  </div>
</div>
{%- endmacro -%}

{%- macro tabs(items, active, label='Sections') -%}
<nav class="tabs" aria-label="{{ label }}">
  {%- for item in items %}
  {%- set id, href, text = item[0], item[1], item[2] %}
  <a class="tab{% if id == active %} is-active{% endif %}" href="{{ href }}" data-testid="tab-{{ id }}"{% if id == active %} aria-current="page"{% endif %}>{{ text }}
    {%- if item|length > 3 and item[3] %} <span class="badge badge-count">{{ item[3] }}</span>{% endif %}</a>
  {%- endfor %}
</nav>
{%- endmacro -%}

{%- macro page_header(title, subtitle=None) -%}
<div class="page-header">
  <div>
    <h1>{{ title }}</h1>
    {%- if subtitle %}
    <p class="page-subtitle">{{ subtitle }}</p>
    {%- endif %}
  </div>
  {%- if caller is defined %}
  <div class="page-actions">{{ caller() }}</div>
  {%- endif %}
</div>
{%- endmacro -%}

{%- macro modal(testid, title, open=False, size='', title_testid=None, attrs='') -%}
<div class="modal-backdrop" hidden{% if open %} data-autoshow{% endif %}>
  <div class="modal{% if size %} modal-{{ size }}{% endif %}" id="{{ testid }}" data-testid="{{ testid }}" role="dialog" aria-modal="true" aria-labelledby="{{ testid }}-title" tabindex="-1"{{ _attrs(attrs) }}>
    <div class="modal-header">
      <h2 id="{{ testid }}-title"{% if title_testid %} data-testid="{{ title_testid }}"{% endif %}>{{ title }}</h2>
      <button type="button" class="icon-btn" data-modal-close aria-label="Close">{{ icon('x') }}</button>
    </div>
    {{ caller() }}
  </div>
</div>
{%- endmacro -%}

{%- macro setting_row(title, desc=None, title_id=None) -%}
<div class="setting-row">
  <div class="setting-text">
    <div class="setting-title"{% if title_id %} id="{{ title_id }}"{% endif %}>{{ title }}</div>
    {%- if desc %}
    <div class="setting-desc">{{ desc }}</div>
    {%- endif %}
  </div>
  <div class="setting-control">{{ caller() }}</div>
</div>
{%- endmacro -%}

{%- macro field(id, label, value='', testid=None, type='text', hint=None, error=None, error_testid=None, textarea=False, rows=4, prefix=None, placeholder=None, attrs='') -%}
{%- set described = ([id ~ '-hint'] if hint else []) + ([id ~ '-error'] if (error or error_testid) else []) %}
{%- set common %} id="{{ id }}"{% if testid %} data-testid="{{ testid }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if described %} aria-describedby="{{ described|join(' ') }}"{% endif %}{{ _attrs(attrs) }}{% endset %}
<div class="field{% if error %} has-error{% endif %}">
  <label for="{{ id }}">{{ label }}</label>
  {%- if textarea %}
  <textarea class="input" rows="{{ rows }}"{{ common }}>{{ value }}</textarea>
  {%- elif prefix %}
  <div class="input-group"><span class="input-prefix" aria-hidden="true">{{ prefix }}</span><input class="input" type="{{ type }}" value="{{ value }}"{{ common }}></div>
  {%- else %}
  <input class="input" type="{{ type }}" value="{{ value }}"{{ common }}>
  {%- endif %}
  {%- if hint %}
  <p class="hint" id="{{ id }}-hint">{{ hint }}</p>
  {%- endif %}
  {%- if error or error_testid %}
  <p class="error" id="{{ id }}-error"{% if error_testid %} data-testid="{{ error_testid }}"{% endif %}{% if not error %} hidden{% endif %}>{{ icon('alert', '1rem') }}<span>{{ error or '' }}</span></p>
  {%- endif %}
</div>
{%- endmacro -%}

{%- macro badge(text, kind='', icon_name=None) -%}
<span class="badge{% if kind %} badge-{{ kind }}{% endif %}">{% if icon_name %}{{ icon(icon_name, '0.875rem') }}{% endif %}{{ text }}</span>
{%- endmacro -%}

{%- macro empty(icon_name, title, text=None) -%}
<div class="empty">
  {{ icon(icon_name, '2rem') }}
  <p class="empty-title">{{ title }}</p>
  {%- if text %}
  <p class="empty-text">{{ text }}</p>
  {%- endif %}
</div>
{%- endmacro -%}
