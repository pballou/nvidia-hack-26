gui_grounding:
  resources_servers:
    gui_grounding:
      entrypoint: app.py
      domain: other
      verified: false
      description: GUI click grounding (screenshot + instruction -> point_2d on a 0-1000 grid)
      value: Binary reward when the predicted click lands inside the target element's pixel box
gui_grounding_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: gui_grounding
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: example
        type: example
        jsonl_fpath: resources_servers/gui_grounding/data/example.jsonl

gui_grounding_environment_server:
  environment_servers:
    legacy_agent:
      entrypoint: app.py
      agent_server:
        type: responses_api_agents
        name: gui_grounding_simple_agent
